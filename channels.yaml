# Projects and their target platforms. Scheduling lives on each row's
# "Publish Date & Time" (Notion) — no fixed slots.
#
# Each project posts as its OWN Instagram account, so IG credentials are
# per-project env vars (see tick._ig_env_names): Useful Math keeps the legacy
# unsuffixed IG_USER_ID / IG_ACCESS_TOKEN, every other project needs a
# suffixed pair such as IG_USER_ID_ATHENA. There is no fallback — a missing
# secret fails the row rather than posting to the wrong account.
#
# caption_limit is the project's EDITORIAL cap, defaulting to Instagram's hard
# 2200. A row over its project's limit fails loudly instead of being truncated:
# truncation eats the END of a caption, which is where sources and hashtags
# live.
useful-math:
  platforms: [youtube-shorts, ig-reels]
  caption_limit: 2000

athena:
  platforms: [ig-carousel]
  caption_limit: 2200
